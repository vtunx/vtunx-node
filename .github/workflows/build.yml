name: Build and Release Sing-box Minimal

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      max-parallel: 1
      matrix:
        goarch: [amd64, arm64]
    steps:
      - name: Get Latest Stable Tag
        id: get_tag
        run: |
          set -euo pipefail
          # 用 git ls-remote 取代 REST API，避免 runner 共享 IP 触发匿名限流(60次/小时)导致取到空 tag
          LATEST_TAG="$(git ls-remote --tags --refs https://github.com/SagerNet/sing-box.git \
            | awk -F'/' '{print $NF}' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V | tail -n1 || true)"
          if [ -z "$LATEST_TAG" ]; then
            echo "::error::无法获取 sing-box 最新稳定 tag，终止发布"
            exit 1
          fi
          echo "本次构建版本: $LATEST_TAG"
          echo "tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box
          ref: ${{ steps.get_tag.outputs.tag }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Build and Optimize
        run: |
          cd cmd/sing-box
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.goarch }} go build -v \
            -trimpath \
            -ldflags "-s -w -buildid= -extldflags '-static'" \
            -o ../../sing-box

      - name: Pack and XZ Minimal
        run: |
          tar -cJf sing-box-linux-${{ matrix.goarch }}.tar.xz sing-box

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          files: sing-box-linux-${{ matrix.goarch }}.tar.xz
          draft: false
          prerelease: false
          body: |
            - **同步官方版本**: `${{ steps.get_tag.outputs.tag }}`
            - **协议裁剪**: 仅保留 `VLESS` + `WS`
