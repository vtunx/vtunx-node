name: Build and Release Sing-box Minimal

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      max-parallel: 1
      matrix:
        goarch: [amd64, arm64]
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box
          ref: v1.9.7

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # 1.9.7 用新 Go 链接会报 net.errNoSuchInterface，必须固定 1.21
          go-version: '1.21.13'

      - name: Build and Optimize
        run: |
          cd cmd/sing-box
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.goarch }} go build -v \
            -trimpath \
            -ldflags "-s -w -buildid= -extldflags '-static'" \
            -o ../../sing-box

      - name: Pack and XZ Minimal
        run: |
          tar -cJf sing-box-linux-${{ matrix.goarch }}.tar.xz sing-box

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.9.7
          files: sing-box-linux-${{ matrix.goarch }}.tar.xz
          draft: false
          prerelease: false
          body: |
               - **构建方式**: 官方源码，不启用可选特性（QUIC/WireGuard/uTLS/ACME/Clash API 等）
               - **体积优化**: -s -w -buildid= 去符号